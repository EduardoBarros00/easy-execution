name: Patch live OS direct options

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-live-os-direct-options.yml'

permissions:
  contents: write

jobs:
  patch-live-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'EduardoBarros00/easy-execution-main'
          fetch-depth: 0
      - name: Apply targeted correction
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/routes/_authenticated/os.tsx')
          s = p.read_text(encoding='utf-8')

          marker = '''  const selectedClient = clients.find((c) => c.id === clientId);'''
          insert = '''  const selectedClient = clients.find((c) => c.id === clientId);

          const serviceOptions = useMemo(() => {
            return filteredTypes.flatMap((type) => {
              const code = serviceCodeFromType(type.name);
              if (!code) return [{ value: type.id, label: type.name }];
              if (code === "PT") return [
                { value: `${type.id}::superior`, label: "PT superior" },
                { value: `${type.id}::inferior`, label: "PT inferior" },
                { value: `${type.id}::both`, label: "PT total (superior + inferior) — 2 próteses" },
              ];
              return [
                { value: `${type.id}::superior`, label: "PPR superior" },
                { value: `${type.id}::inferior`, label: "PPR inferior" },
                { value: `${type.id}::both`, label: "PPR superior + inferior — 2 próteses" },
              ];
            });
          }, [filteredTypes]);

          const selectedServiceOptionValue = pricedServiceCode && arcade ? `${typeId}::${arcade}` : typeId;'''
          if 'const serviceOptions = useMemo(() =>' not in s:
            if marker not in s: raise SystemExit('selectedClient marker not found')
            s = s.replace(marker, insert, 1)

          s = s.replace('if (editing || priceManuallyEdited) return;', 'if (priceManuallyEdited) return;', 1)
          s = s.replace('[editing, priceManuallyEdited, cityId, pricedServiceCode, arcade, cityServicePrices]', '[priceManuallyEdited, cityId, pricedServiceCode, arcade, cityServicePrices]', 1)

          old_handler = '''  const handleTypeChange = (id: string) => {
            setTypeId(id);
            setArcade("");
            if (!editing) {
              setPriceValue("0");
              setPriceManuallyEdited(false);
            }
          };

          const handleArcadeChange = (value: Arcade) => {
            setArcade(value);
            if (!editing) setPriceManuallyEdited(false);
          };'''
          new_handler = '''  const handleTypeChange = (value: string) => {
            const [nextTypeId, nextArcade = ""] = value.split("::");
            setTypeId(nextTypeId);
            setArcade(nextArcade as Arcade);
            setPriceValue("0");
            setPriceManuallyEdited(false);
          };'''
          if old_handler in s:
            s = s.replace(old_handler, new_handler, 1)

          start = s.find('''            <div className="space-y-1.5">\n              <Label>Tipo de atendimento (catálogo)</Label>''')
          end_marker = '''            <div className="space-y-1.5 sm:col-span-2">\n              <Label>Unidade Básica de Saúde (UBS) *</Label>'''
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
            raise SystemExit('service selector block not found')
          replacement = '''            <div className="space-y-1.5">
              <Label>Tipo de atendimento (catálogo)</Label>
              <Select value={selectedServiceOptionValue} onValueChange={handleTypeChange} disabled={!cityId || serviceOptions.length === 0}>
                <SelectTrigger><SelectValue placeholder={!cityId ? "Selecione o contratante primeiro" : serviceOptions.length ? "Selecione…" : "Nenhum tipo disponível nesta cidade"} /></SelectTrigger>
                <SelectContent>{serviceOptions.map((option) => <SelectItem key={option.value} value={option.value}>{option.label}</SelectItem>)}</SelectContent>
              </Select>
              {pricedServiceCode && arcade && <p className="text-[11px] text-muted-foreground">Valor automático pela cidade. Superior/inferior = 1 prótese; superior + inferior = 2 próteses.</p>}
            </div>

            {!pricedServiceCode && (
              <div className="space-y-1.5 sm:col-span-2">
                <Label>Descrição do atendimento</Label>
                <Input value={serviceTypeText} onChange={(e) => setServiceTypeText(e.target.value)} placeholder="Ex: Reembasamento, Limpeza, etc." />
              </div>
            )}

'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
      - name: Commit to live Lovable branch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/_authenticated/os.tsx
          git commit -m 'fix: mostra seis opções diretas de PT e PPR'
          git push origin HEAD:'EduardoBarros00/easy-execution-main'
